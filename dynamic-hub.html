<!DOCTYPE html>
<html lang="en">
<head>
<script>
if (sessionStorage.getItem('dynamic-memory-gate-pass') !== '1') {
  window.location.replace('index.html');
}
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Dynamic Memory · Training Modes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

/* Fixed to the viewport rather than height:100vh — 100vh recalculates
   whenever a mobile/VR browser's UI chrome shows or hides, and reacting
   to that recalculation is what causes a page to drift on its own.
   Fixed positioning removes the dependency entirely. */
html,body{
  height:100%;
  overflow:hidden;
  background:#000;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
body{
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}

/* True black, not a dark gradient — same solid background as every
   other page in this flow, on desktop or in a VR headset. */
#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:#000;
}

#panel{
  position:relative;
  z-index:2;
  width:100%;
  max-width:820px;
  max-height:100%;
  overflow-y:auto;
  text-align:center;
}

.arena-title{
  font-size:1.6rem;
  font-weight:900;
  font-style:italic;
  letter-spacing:.03em;
  text-transform:uppercase;
  margin:28px 0 2px;
  text-shadow:0 0 30px rgba(243,116,24,.4);
}
.arena-title span{color:#f37418}
.arena-sub{
  font-size:.72rem;
  font-weight:900;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:#7c3aed;
  margin-bottom:26px;
}

/* Section heading — the parts are genuinely different kinds of
   training, so they are grouped rather than presented as one
   undifferentiated grid of buttons. */
.group-label{
  font-size:.6rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;
  color:#5c5468;margin:0 auto 10px;max-width:640px;text-align:left;padding-left:4px;
}

/* Individual quarter cards — standalone practice for any one of the
   memory games. */
.quarter-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
  max-width:640px;margin:0 auto 26px;
}
.quarter-card{
  display:block;text-decoration:none;padding:14px 12px;border-radius:14px;
  border:1.5px solid rgba(124,58,237,.35);background:rgba(124,58,237,.08);
  text-align:left;transition:background .12s,border-color .12s,transform .08s;
}
.quarter-card:active{transform:scale(.97);background:rgba(124,58,237,.16)}
.quarter-num{
  font-size:.62rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;
  color:#a855f7;margin-bottom:4px;
}
.quarter-name{
  font-size:.98rem;font-weight:900;font-style:italic;letter-spacing:.01em;
  text-transform:uppercase;color:#fff;margin-bottom:4px;line-height:1.1;
}

/* Ritnome is reaction training, not memory — its own card, in its
   own color, so the difference reads at a glance. */
.rit-card{
  display:block;text-decoration:none;padding:16px 14px;border-radius:14px;
  border:1.5px solid rgba(0,229,255,.4);background:rgba(0,229,255,.08);
  text-align:left;max-width:640px;margin:0 auto 26px;
  transition:background .12s,transform .08s;
}
.rit-card:active{transform:scale(.98);background:rgba(0,229,255,.16)}
.rit-num{font-size:.62rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#00e5ff;margin-bottom:4px}
.rit-name{font-size:.98rem;font-weight:900;font-style:italic;text-transform:uppercase;color:#fff;line-height:1.1}
.rit-note{font-size:.68rem;color:#7d8ba3;margin-top:5px}

/* Standings covers both products, so it sits on its own rather
   than inside either group. */
.standings-card{
  display:block;text-decoration:none;padding:15px 14px;border-radius:14px;
  border:1.5px solid rgba(255,211,90,.4);background:rgba(255,211,90,.07);
  max-width:640px;margin:0 auto 6px;text-align:left;
  transition:background .12s,transform .08s;
}
.standings-card:active{transform:scale(.98);background:rgba(255,211,90,.14)}
.standings-name{font-size:.95rem;font-weight:900;font-style:italic;text-transform:uppercase;color:#fff}
.standings-note{font-size:.68rem;color:#8a7d5f;margin-top:4px}

footer{
  margin-top:24px;
  font-size:.72rem;
  color:#6b5d52;
  letter-spacing:.02em;
}
.school-tag{font-size:.68rem;color:#5c5468;margin-top:6px;letter-spacing:.04em}

#soundToggle{
  position:fixed;top:14px;right:14px;z-index:30;width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);color:#fff;font-size:1rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);
}
#exitHubBtn{
  position:fixed;top:14px;left:14px;z-index:30;padding:8px 16px;border-radius:999px;
  border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);color:#fff;font-size:.78rem;
  font-weight:900;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(4px);
}
#switchProgramBtn{
  position:fixed;top:56px;left:14px;z-index:30;padding:8px 14px;border-radius:999px;
  border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);color:#fff;font-size:.72rem;
  font-weight:900;letter-spacing:.04em;cursor:pointer;backdrop-filter:blur(4px);
}
</style>
</head>
<body>
<button id="soundToggle" aria-label="Toggle sound" title="Toggle beat sound">🔊</button>
<button id="exitHubBtn" type="button">Exit →</button>
<button id="switchProgramBtn" type="button">🔄 Switch Code</button>

<div id="stage">
  <div id="panel">
    <div class="arena-title">DYNAMIC <span>MEMORY</span></div>
    <div class="arena-sub">Memory &amp; Reaction Basketball Training</div>

    <div class="group-label">Memory</div>
    <div class="quarter-grid">
      <a class="quarter-card" href="dynamic-memory-the-fortress.html">
        <div class="quarter-num">Q1</div>
        <div class="quarter-name">The Fortress</div>
      </a>
      <a class="quarter-card" href="dynamic-memory-recall.html">
        <div class="quarter-num">Q2</div>
        <div class="quarter-name">Recall</div>
      </a>
      <a class="quarter-card" href="dynamic-memory-recognition.html">
        <div class="quarter-num">Q3</div>
        <div class="quarter-name">Recognition</div>
      </a>
      <a class="quarter-card" href="dynamic-memory-standings.html">
        <div class="quarter-num">🏆</div>
        <div class="quarter-name">Memory Standings</div>
      </a>
    </div>

    <div class="group-label">Reaction</div>
    <a class="rit-card" href="ritnome.html">
      <div class="rit-num">🏀 Ritnome</div>
      <div class="rit-name">Go No Go &amp; Reaction Speed</div>
      <div class="rit-note">Tap on the beat. Included with your access.</div>
    </a>

    <footer>Gostar Digital LLC</footer>
    <div class="school-tag" id="schoolTag"></div>
  </div>
</div>

<script>
(function(){
var soundBtn=document.getElementById('soundToggle');
var muted=false;

soundBtn.addEventListener('click',function(e){
  e.stopPropagation();
  muted=!muted;
  soundBtn.textContent=muted?'🔇':'🔊';
  soundBtn.style.opacity=muted?'.55':'1';
});

// Shows whose access this is — useful on a shared classroom device
// where the last person's code may still be the one in session.
var school=sessionStorage.getItem('hoop-school');
if(school){ document.getElementById('schoolTag').textContent=school; }

// Exits the product entirely — clears every pass so the next visit
// genuinely requires the access code again, rather than silently
// letting a stale session back in. All parts are cleared together,
// since one code opened all of them.
function clearAccess(){
  ['dynamic-memory-gate-pass','dynamic-memory-standings-gate-pass',
   'ritnome-gate-pass','ritnome-standings-gate-pass',
   'hoop-license','ritnome-license',
   'hoop-school','ritnome-school'].forEach(function(k){
    sessionStorage.removeItem(k);
  });
}

document.getElementById('exitHubBtn').addEventListener('click',function(){
  clearAccess();
  window.location.href='index.html';
});

// The one visible way to deliberately back out and enter a different
// code, without needing any browser or settings knowledge at all. A
// confirm dialog guards against an accidental tap locking someone
// out of the game with no new code in hand yet.
document.getElementById('switchProgramBtn').addEventListener('click',function(){
  if(!confirm('Switch to a new school or code? You\'ll need a new access code to get back in.'))return;
  clearAccess();
  window.location.href='index.html';
});
})();
</script>
</body>
</html>
