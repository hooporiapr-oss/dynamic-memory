<!DOCTYPE html>
<html lang="en">
<head>
<script>
if (sessionStorage.getItem('dynamic-memory-gate-pass') !== '1') {
  window.location.replace('index.html');
}
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Dynamic Memory · Training Modes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

/* Fixed to the viewport rather than height:100vh — 100vh recalculates
   whenever a mobile/VR browser's UI chrome shows or hides, and reacting
   to that recalculation is what causes a page to drift on its own.
   Fixed positioning removes the dependency entirely. */
html,body{
  height:100%;
  overflow:hidden;
  background:#000;
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
body{
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}

/* True black, not a dark gradient — same solid background as every
   other page in this flow, on desktop or in a VR headset. */
#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:#000;
}

#panel{
  position:relative;
  z-index:2;
  width:100%;
  max-width:820px;
  max-height:100%;
  overflow-y:auto;
  text-align:center;
}

.back-btn{
  display:inline-block;
  padding:10px 20px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.5);
  color:#fff;
  font-size:.78rem;
  font-weight:900;
  letter-spacing:.06em;
  text-transform:uppercase;
  text-decoration:none;
  margin-bottom:20px;
}
.back-btn:active{transform:scale(.98)}

.subtitle{
  font-size:1.25rem;
  font-weight:700;
  color:#c9b8a8;
  margin-bottom:24px;
  letter-spacing:.03em;
}

.arena-title{
  font-size:1.6rem;
  font-weight:900;
  font-style:italic;
  letter-spacing:.03em;
  text-transform:uppercase;
  margin:28px 0 2px;
  text-shadow:0 0 30px rgba(243,116,24,.4);
}
.arena-title span{color:#f37418}
.arena-sub{
  font-size:.72rem;
  font-weight:900;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:#7c3aed;
  margin-bottom:18px;
}
/* Individual quarter cards — standalone practice for any one of the
   4 games. */
.quarter-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
  max-width:640px;margin:0 auto 22px;
}
.quarter-card:last-child:nth-child(odd){grid-column:1/-1;text-align:center}
.quarter-card{
  display:block;text-decoration:none;padding:14px 12px;border-radius:14px;
  border:1.5px solid rgba(124,58,237,.35);background:rgba(124,58,237,.08);
  text-align:left;transition:background .12s,border-color .12s,transform .08s;
}
.quarter-card:active{transform:scale(.97);background:rgba(124,58,237,.16)}
.quarter-num{
  font-size:.62rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;
  color:#a855f7;margin-bottom:4px;
}
.quarter-name{
  font-size:.98rem;font-weight:900;font-style:italic;letter-spacing:.01em;
  text-transform:uppercase;color:#fff;margin-bottom:4px;line-height:1.1;
}

footer{
  margin-top:24px;
  font-size:.72rem;
  color:#6b5d52;
  letter-spacing:.02em;
}

#soundToggle{
  position:fixed;top:14px;right:14px;z-index:30;width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);color:#fff;font-size:1rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);
}
#exitHubBtn{
  position:fixed;top:14px;left:14px;z-index:30;padding:8px 16px;border-radius:999px;
  border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);color:#fff;font-size:.78rem;
  font-weight:900;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(4px);
}

/* Switch Program — moved out of the inline panel and up to a fixed
   corner button, matching Reaction Velocity's own placement and
   label exactly, so the same action reads the same way on both
   products. Session-clearing logic underneath is unchanged. */
#switchProgramBtn{
  position:fixed;top:56px;left:14px;z-index:30;padding:8px 14px;border-radius:999px;
  border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);color:#fff;font-size:.72rem;
  font-weight:900;letter-spacing:.04em;cursor:pointer;backdrop-filter:blur(4px);
}

/* Ritnome — a direct link across to the platform's sibling
   product. Right corner, below the sound toggle — separate from
   Exit on the left, since this is a cross-product link, not a
   same-product session action. */
#ritnomeTab{
  position:fixed;top:66px;right:14px;z-index:30;padding:8px 14px;border-radius:999px;
  border:1px solid rgba(255,107,53,.5);background:rgba(255,107,53,.15);color:#fff;font-size:.72rem;
  font-weight:900;letter-spacing:.04em;cursor:pointer;backdrop-filter:blur(4px);text-decoration:none;
  display:inline-block;
}
</style>
</head>
<body>
<button id="soundToggle" aria-label="Toggle sound" title="Toggle beat sound">🔊</button>
<button id="exitHubBtn" type="button">Exit →</button>
<button id="switchProgramBtn" type="button">🔄 Switch Program</button>
<a id="ritnomeTab" href="https://ritnome.com">🏀 Ritnome</a>

<div id="stage">
  <div id="panel">
    <div class="arena-title">DYNAMIC <span>MEMORY</span></div>
    <div class="arena-sub">Memory-Based Basketball Challenges</div>

    <div class="quarter-grid">
      <a class="quarter-card" href="dynamic-memory-the-fortress.html">
        <div class="quarter-num">Q1</div>
        <div class="quarter-name">The Fortress</div>
      </a>
      <a class="quarter-card" href="dynamic-memory-recall.html">
        <div class="quarter-num">Q2</div>
        <div class="quarter-name">Play Call</div>
      </a>
      <a class="quarter-card" href="dynamic-memory-replay.html">
        <div class="quarter-num">Q3</div>
        <div class="quarter-name">Pass Path</div>
      </a>
      <a class="quarter-card" href="dynamic-memory-recognition.html">
        <div class="quarter-num">Q4</div>
        <div class="quarter-name">Read the Defense</div>
      </a>
      <a class="quarter-card" href="dynamic-memory-standings.html">
        <div class="quarter-num">🏆</div>
        <div class="quarter-name">View Standings</div>
      </a>
    </div>

    <footer>Gostar Digital LLC</footer>
  </div>
</div>

<script>
(function(){
var soundBtn=document.getElementById('soundToggle');
var muted=false;

soundBtn.addEventListener('click',function(e){
  e.stopPropagation();
  muted=!muted;
  soundBtn.textContent=muted?'🔇':'🔊';
  soundBtn.style.opacity=muted?'.55':'1';
});

// Exits the product entirely — clears the gate pass so the next
// visit genuinely requires the access code again, rather than
// silently letting a stale session back in.
document.getElementById('exitHubBtn').addEventListener('click',function(){
  sessionStorage.removeItem('dynamic-memory-gate-pass');
  window.location.href='index.html';
});

// The device unlock is otherwise permanent by design (enter a code
// once, never asked again) — this is the one, visible way to
// deliberately back out of that and enter a different code, without
// needing any browser/settings knowledge at all. A confirm dialog
// guards against an accidental tap locking someone out of the game
// with no new code in hand yet.
document.getElementById('switchProgramBtn').addEventListener('click',function(){
  if(!confirm('Switch to a new school or code? You\'ll need a new access code to get back in.'))return;
  sessionStorage.removeItem('dynamic-memory-gate-pass');
  sessionStorage.removeItem('hoop-license');
  sessionStorage.removeItem('hoop-school');
  window.location.href='index.html';
});
})();
</script>
</body>
</html>
