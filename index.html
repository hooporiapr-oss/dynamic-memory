<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dynamic Memory · Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--purple:#7c3aed;--purple-deep:#5b21b6;--orange:#f37418;--dark:#0a0a0f;--text:#fff;--muted:#8892a0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Outfit',sans-serif;background:var(--dark);color:var(--text);touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overflow:hidden}

#center{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at center,#1a0f2e 0%,#000 70%)}

.gate-title{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;letter-spacing:.03em;text-transform:uppercase;margin-bottom:10px;text-shadow:0 0 30px rgba(124,58,237,.5)}
.gate-title span{color:var(--purple)}
.gate-sub{font-size:.85rem;color:var(--muted);margin-bottom:40px}

.code-panel{width:100%;max-width:340px}
.code-label{font-size:.68rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.code-input{width:100%;padding:16px;border-radius:10px;border:2px solid rgba(124,58,237,.4);background:rgba(255,255,255,.06);color:#fff;font-size:1.5rem;font-weight:900;letter-spacing:.3em;text-transform:uppercase;text-align:center;font-family:'Courier New',monospace}
.code-input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 24px rgba(124,58,237,.35)}
.code-input.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

.enter-btn{width:100%;margin-top:16px;padding:15px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--purple),var(--purple-deep));color:#fff;font-size:.9rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.enter-btn:active{transform:scale(.98)}
.err{margin-top:14px;color:#ff8888;font-size:.82rem;font-weight:700;min-height:18px}

.brandmark{margin-top:44px;font-size:.68rem;font-weight:900;letter-spacing:.3em;text-transform:uppercase;color:#4a5058}
.brandmark b{color:var(--muted);font-style:italic}

@media(max-width:480px){.gate-title{font-size:1.8rem}}
</style>
</head>
<body>

<div id="center">
  <div class="gate-title">DYNAMIC <span>MEMORY</span></div>
  <div class="gate-sub">Memory-Based Basketball Challenges</div>

  <div class="code-panel">
    <div class="code-label">Access Code</div>
    <input class="code-input" id="gate-code" maxlength="12" placeholder="• • • •" autocomplete="off" onkeydown="if(event.key==='Enter')tryEnter()">
    <button class="enter-btn" onclick="tryEnter()">Enter Dynamic Memory →</button>
    <div class="err" id="gate-err"></div>
  </div>

  <div class="brandmark">Powered by <b>Gostar Digital</b></div>
</div>

<script>
var $=function(id){return document.getElementById(id)};

// ══════════════════════════════════════════════════════
//  LICENSE SYSTEM — this is its own separate repo, distinct
//  from every other product's own domain. To issue / expire /
//  revoke codes, use admin.html → the Hooporia tab.
//
//  This gate is scoped to product='hooporia' — a code issued
//  for any other product will NOT unlock this gate, and a
//  Hooporia code won't unlock those, even though all of them
//  live in the same Supabase licenses table.
//
//  The school name captured here travels with the player from
//  this point forward via sessionStorage — every game they play
//  and the standings board itself both read it back from here,
//  rather than each needing its own separate login of its own.
// ══════════════════════════════════════════════════════
var SUPABASE_URL = 'https://sdaphocueugzfvjovuxd.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYXBob2N1ZXVnemZ2am92dXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQyMDgsImV4cCI6MjA5OTIwMDIwOH0.pDAzf4P6dD9eNEBlnP95SdF5BI-R84-Rdc0vKzYcn7M';
var PRODUCT = 'hooporia';
// ══════════════════════════════════════════════════════

if (sessionStorage.getItem('dynamic-memory-gate-pass') === '1') {
  window.location.replace('dynamic-hub.html');
}

function tryEnter(){
  var input = $('gate-code').value.trim();
  if (!input){ return; }
  $('gate-err').style.color = '';
  $('gate-err').textContent = 'Checking…';

  var url = SUPABASE_URL + '/rest/v1/licenses'
    + '?select=code,expires_at,active,product,school_name'
    + '&code=ilike.' + encodeURIComponent(input)
    + '&active=eq.true'
    + '&product=eq.' + PRODUCT;

  fetch(url, {
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
    }
  })
  .then(function(r){ return r.json(); })
  .then(function(rows){
    var lic = (rows && rows.length) ? rows[0] : null;

    if (!lic){ return reject('Invalid code — check with your administrator'); }

    if (lic.expires_at){
      var exp = new Date(lic.expires_at + 'T23:59:59');
      if (new Date() > exp){ return reject('This license has expired'); }
    }

    sessionStorage.setItem('dynamic-memory-gate-pass','1');
    sessionStorage.setItem('hoop-license', input.toUpperCase());
    sessionStorage.setItem('hoop-school', lic.school_name || '');
    window.location.href = 'dynamic-hub.html';
  })
  .catch(function(){
    reject('Connection problem — please try again');
  });
}

function reject(msg){
  $('gate-err').style.color = '#ff8888';
  $('gate-err').textContent = msg;
  var box = $('gate-code');
  box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
  box.value=''; box.focus();
}

$('gate-code').focus();
</script>
</body>
</html>
