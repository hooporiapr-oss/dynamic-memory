<body>
<div id="replay_screen-intro">
  <button style="position:fixed;top:16px;left:16px;padding:8px 16px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.5);color:#fff;font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;cursor:pointer;z-index:120" id="replayExitBtn" type="button">← Back</button>

<script>
(function(){
var $=id=>document.getElementById(id);

var gameMode='game'; // 'game' | 'training'

//  scoring math, just recording the real result.
// ══════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════

//  over, whether standalone practice or part of a tracked Full
//  Game run.

// ══════════════════════════════════════════════════════
//  FULL GAME MODE — four quarters chained together with a real,
//  running scoreboard. Only active when the player started from the
//  "Play the Full Game" button on the Arena page, which sets these
//  session flags. Standalone play (clicking straight into this game)
//  never sees any of this — sessionStorage stays empty, and the
//  normal solo end screen shows exactly as it always has.
// ══════════════════════════════════════════════════════
var THIS_QUARTER=3;
var QUARTER_SEQUENCE=[
  {n:1,label:'1st',file:'dynamic-memory-recall.html'},
  {n:2,label:'2nd',file:'dynamic-memory-reflex.html'},
  {n:3,label:'3rd',file:'dynamic-memory-replay.html'},
  {n:4,label:'4th',file:'dynamic-memory-recognition.html'}
];
function isFullGameActive(){return sessionStorage.getItem('hoop-fullgame-active')==='1'}
function loadQuarterScores(){
  try{return JSON.parse(sessionStorage.getItem('hoop-quarter-scores')||'{"q1":0,"q2":0,"q3":0,"q4":0}')}
  catch(e){return {q1:0,q2:0,q3:0,q4:0}}
}
function showQuarterStats(finalScore){
  var scores=loadQuarterScores();
  scores['q'+THIS_QUARTER]=finalScore;
  sessionStorage.setItem('hoop-quarter-scores',JSON.stringify(scores));
  var total=scores.q1+scores.q2+scores.q3+scores.q4;

  document.getElementById('qsTitle').textContent=QUARTER_SEQUENCE[THIS_QUARTER-1].label.toUpperCase()+' QUARTER COMPLETE!';
  document.getElementById('qsQ1').textContent=scores.q1;
  document.getElementById('qsQ2').textContent=scores.q2;
  document.getElementById('qsQ3').textContent=scores.q3;
  document.getElementById('qsQ4').textContent=scores.q4;
  document.getElementById('qsTotal').textContent=total;
  for(var i=1;i<=4;i++)document.getElementById('qsCell'+i).classList.toggle('qs-current',i===THIS_QUARTER);

  var nextBtn=document.getElementById('qsNextBtn');
  if(THIS_QUARTER<4){
    var nextQ=QUARTER_SEQUENCE[THIS_QUARTER];
    nextBtn.textContent='NEXT: '+nextQ.label.toUpperCase()+' QUARTER →';
    nextBtn.onclick=function(){window.location.href=nextQ.file};
    document.getElementById('quarterStatsScreen').style.display='flex';
  }else{
    sessionStorage.setItem('hoop-fullgame-active','0');
    window.location.href='dynamic-memory-final-score.html';
  }
}
var trainingLevel=1; // 1-5
var LEVEL_CELLS={1:3,2:4,3:5,4:6,5:7};
var TRAINING_ROUNDS=10;
function getInitialCellCount(){return gameMode==='training'?LEVEL_CELLS[trainingLevel]:STARTING_CELLS}

document.querySelectorAll('[data-gamemode]').forEach(btn=>{
  btn.onclick=function(){
    gameMode=btn.dataset.gamemode;
    document.querySelectorAll('[data-gamemode]').forEach(b=>b.classList.remove('rby-active'));
    btn.classList.add('rby-active');
    $('replay_levelRow').classList.toggle('rby-hidden',gameMode!=='training');
  };
});
document.querySelectorAll('[data-level]').forEach(btn=>{
  btn.onclick=function(){
    trainingLevel=Number(btn.dataset.level);
    document.querySelectorAll('[data-level]').forEach(b=>b.classList.remove('rby-active'));
    btn.classList.add('rby-active');
  };
});

function getBeatMs(){return Math.round((60000/bpm)*10)}
function getShowMs(){return Math.round((60000/bpm)*0.65)}
function getGapMs(){return Math.round((60000/bpm)*0.35)}

/* Full-screen strobe — runs only while waiting for the player to react,
   stops the instant they make their first tap. Reuses the same beat click
   as the note system for a single consistent Ritnome beat sound. */
var strobeInterval=null;
function startFullStrobe(){
  stopFullStrobe();
  var beatMs=60000/bpm;
  var el=$('replay_fsStrobe');
  strobeInterval=setInterval(function(){
    el.style.transition='none';
    el.style.opacity='.35';
    playTone(440,.1);
    setTimeout(function(){
      el.style.transition='opacity .15s';
      el.style.opacity='0';
    },Math.min(120,beatMs*.3));
  },beatMs);
}
function stopFullStrobe(){
  if(strobeInterval){clearInterval(strobeInterval);strobeInterval=null}
  var el=$('replay_fsStrobe');el.style.transition='none';el.style.opacity='0';
}

/* Recall timer — one beat per cell in the current sequence, ticking down live. */
var recallDeadline=0,recallRAF=null;
function startRecallTimer(){
  var dur=getBeatMs();
  recallDeadline=performance.now()+dur;
  function tick(){
    var remain=recallDeadline-performance.now();
    var pct=Math.max(0,remain/dur);
    $('replay_clockFill').style.width=(pct*100)+'%';
    $('replay_hTr').textContent=Math.max(0,remain/1000).toFixed(1)+'s';
    if(remain<=0){recallRAF=null;handleTimeout();return}
    if(phase==='tapping')recallRAF=requestAnimationFrame(tick);
  }
  recallRAF=requestAnimationFrame(tick);
}
function stopRecallTimer(){if(recallRAF){cancelAnimationFrame(recallRAF);recallRAF=null}}

function launchGame(nm){
  currentPlayerName=nm.slice(0,20);
  roundShotLog=[];
  $('replay_screen-intro').style.display='none';$('replay_screen-game').style.display='flex';
  g.cellCount=getInitialCellCount();g.roundsDone=0;
  buildCourt();updateHUD();
  resizeCourtToFit();
  try{ if(!document.fullscreenElement && document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen().catch(function(){}); } }catch(e){}
}
$('replay_startBtn').onclick=function(){
  var nameField=$('playerNameInputMain');
  var nm=nameField.value.trim();
  if(!nm){
    nameField.focus();
    nameField.style.borderColor='#FF1493';
    setTimeout(function(){nameField.style.borderColor=''},600);
    return;
  }
  launchGame(nm);
  };

function resizeCourtToFit(){
  var area=document.querySelector('.rby-court-area');
  var court=document.getElementById('replay_court');
  if(!area||!court)return;
  var areaW=area.clientWidth;
  var areaH=area.clientHeight;
  if(!areaW||!areaH)return;
  var targetW=areaW;
  var targetH=targetW/2;
  if(targetH>areaH){
    targetH=areaH;
    targetW=targetH*2;
  }
  court.style.width=targetW+'px';
  court.style.height=targetH+'px';
}
window.addEventListener('resize',resizeCourtToFit);

$('replay_menuBtn').onclick=function(){stopFullStrobe();stopRecallTimer();window.location.href='dynamic-hub.html'};

var cells=[];
function buildCourt(){var court=$('replay_court');court.innerHTML='';cells=[];for(var i=0;i<50;i++){var c=document.createElement('div');c.className='rby-cell';c.dataset.i=i;c.addEventListener('pointerdown',(function(idx){return function(e){e.preventDefault();handleTap(idx)}})(i));court.appendChild(c);cells.push(c)}}
function cellSt(i,st,num){cells[i].className='rby-cell';cells[i].textContent='';cells[i].style.color='transparent';if(st){cells[i].classList.add(st);if(num!==undefined){cells[i].textContent=num;cells[i].style.color=''}}}
function resetCells(){cells.forEach((_,i)=>cellSt(i))}

var g={sc:0,cellCount:getInitialCellCount(),best:0,streak:0,roundsDone:0};
function updateHUD(){
  $('replay_hSc').textContent=g.sc;
  $('replay_hSeq').textContent=bpm+' BPM';
  if(gameMode==='training'){
    $('replay_hRdLbl').textContent='Level';
    $('replay_hRd').textContent=g.cellCount+' (L'+trainingLevel+')';
    $('replay_hLvLbl').textContent='Progress';
    $('replay_hLv').textContent=g.roundsDone+'/'+TRAINING_ROUNDS;
  }else{
    $('replay_hRdLbl').textContent='Sequence';
    $('replay_hRd').textContent=g.cellCount;
    $('replay_hLvLbl').textContent='Best';
    $('replay_hLv').textContent=g.best;
  }
  $('replay_hSt').textContent=g.streak;
  $('replay_ps1').textContent=g.cellCount;
}
function msg(txt,cls){var el=$('replay_msg');el.textContent=txt;el.className='rby-msg-bar '+(cls||'rby-watch')}
function shuffle(arr){for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t}return arr}
function genSeq(){return shuffle(Array.from({length:50},(_,i)=>i)).slice(0,g.cellCount)}

var NOTES=[262,294,330,349,392,440,494,523,587,659,698,784,880,988,1047];
var audioCtx=null;
function playTone(freq,dur){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();var o=audioCtx.createOscillator(),g2=audioCtx.createGain();o.type='sine';o.frequency.value=freq;o.connect(g2);g2.connect(audioCtx.destination);g2.gain.setValueAtTime(.25,audioCtx.currentTime);g2.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur+.05)}catch(e){}}
function playNote(idx){playNote_(idx);beatPulse()}
function playNote_(idx){playTone(NOTES[idx%15],.18)}
function beatPulse(){
  var b=document.getElementById('replay_seq-beat');
  if(!b)return;
  b.classList.add('pulse');
  setTimeout(function(){b.classList.remove('pulse')},Math.min(240,getShowMs()*0.4));
}

var phase='idle',sequence=[],playerIdx=0,timers=[],firstTapDone=false,attemptNum=0,repeatOfferNum=0,runStartTime=0;
function clrT(){timers.forEach(clearTimeout);timers=[]}

function revealSequence(cb){
  var showMs=getShowMs(),gapMs=getGapMs();
  var i=0;
  function next(){
    if(phase!=='showing')return;
    if(i>0)cellSt(sequence[i-1]);
    if(i<sequence.length){cellSt(sequence[i],'rby-lit',i+1);playNote(sequence[i]);i++;timers.push(setTimeout(next,showMs+gapMs))}
    else{
      timers.push(setTimeout(function(){
        cellSt(sequence[sequence.length-1]);
        cb();
      },300));
    }
  }
  next();
}

// A wrong tap now genuinely ends the game outright — these are
// practice/how-to-play rounds, not a scored run with retries, so a
// miss goes straight to the final-score screen and back to the hub.
function handleFailure(wrongIdx){
  if(wrongIdx!==null)cellSt(wrongIdx,'rby-wrong');
  endGame(wrongIdx);
}


function startRound(){
  if(phase!=='idle')return;
  clrT();phase='showing';playerIdx=0;firstTapDone=false;attemptNum=0;repeatOfferNum=0;
  resetCells();stopFullStrobe();stopRecallTimer();
  $('replay_actBtn').disabled=true;$('replay_restartBtn').style.display='none';
  updateHUD();
  $('replay_clockFill').style.width='100%';$('replay_hTr').textContent='--';
  if(sequence.length===0){
    // The very first round of a new run — starts the clock here,
    // not at launchGame(), since any time spent reading the intro
    // screen or getting ready shouldn't count toward how fast the
    // level was actually reached.
    runStartTime=performance.now();
  }
  if(gameMode==='training'){
    // Training plays at one fixed, selected level throughout — a
    // fresh sequence each round, same as before.
    sequence=genSeq();
  }else{
    // Game mode now matches The Fortress's own established
    // mechanic exactly — the sequence keeps every earlier position
    // and just gets one new, genuinely random cell pushed onto the
    // end each round, rather than being regenerated from scratch.
    // The very first round of a new game starts at level 2 — pushes
    // two cells here instead of the usual one — then every round
    // after this still only ever adds exactly one.
    var pushCount=sequence.length===0?2:1;
    for(var pc=0;pc<pushCount;pc++)sequence.push(Math.floor(Math.random()*50));
  }
  msg('WATCH THE SEQUENCE...','rby-watch');
  timers.push(setTimeout(function(){
    revealSequence(function(){
      msg('⚡ REPLAY IT!','rby-go');
      phase='tapping';
      startFullStrobe();
      startRecallTimer();
    });
  },600));
}

var tapLocked=false;
function handleTap(idx){
  if(phase==='showing'){msg('⏳ WAIT FOR IT...','rby-watch');return;}
  if(phase!=='tapping')return;
  if(tapLocked)return;
  tapLocked=true;
  setTimeout(function(){tapLocked=false},80);

  if(!firstTapDone){
    firstTapDone=true;
    stopFullStrobe(); // the beat stops the instant a reaction begins
  }

  cells[idx].classList.add('rby-player-tap');playNote(idx);
  timers.push(setTimeout(function(){if(cells[idx])cells[idx].classList.remove('rby-player-tap')},200));

  if(idx===sequence[playerIdx]){
    cellSt(idx,'rby-correct',playerIdx+1);playerIdx++;
    if(playerIdx>=sequence.length){
      phase='idle';clrT();stopFullStrobe();stopRecallTimer();
      g.streak++;
      var pts=attemptNum===0?g.cellCount*10:(attemptNum===1?g.cellCount*5:g.cellCount*1);
      g.sc+=pts;
      roundShotLog.push({hit:true,round:g.cellCount,pts:pts});
      var ptsLabel=attemptNum===0?'':(' ('+pts+' PT'+(pts===1?'':'S')+') · ');

      if(gameMode==='training'){
        g.roundsDone++;
        updateHUD();
        if(g.roundsDone>=TRAINING_ROUNDS){
          msg('🏆 LEVEL COMPLETE!','rby-perfect');
          timers.push(setTimeout(showTrainingComplete,900));
        }else{
          msg('✅ CORRECT'+ptsLabel+' ('+g.roundsDone+'/'+TRAINING_ROUNDS+')','rby-perfect');
          timers.push(setTimeout(function(){resetCells();autoNextRound()},700));
        }
      }else{
        if(g.cellCount>g.best)g.best=g.cellCount;
        g.cellCount++;
        // Escalation bonus — reaching a new level is its own reward,
        // not just folded into the next round's normal score. Grows
        // naturally with how far the sequence has climbed.
        var escBonus=g.cellCount*10;
        g.sc+=escBonus;
        updateHUD();
        msg('✅ '+(attemptNum===0?'PERFECT! ':'CORRECT'+ptsLabel)+'SEQUENCE GROWS! +'+escBonus+' BONUS','rby-perfect');
        timers.push(setTimeout(function(){resetCells();autoNextRound()},700));
      }
    }
  }else{
    handleFailure(idx);
  }
}

function handleTimeout(){
  if(phase!=='tapping')return;
  handleFailure(null);
}

function endGame(wrongIdx){
  phase='idle';clrT();stopFullStrobe();stopRecallTimer();
  if(wrongIdx!==null)cellSt(wrongIdx,'rby-wrong');
  roundShotLog.push({hit:false,round:g.cellCount,pts:0});
  g.streak=0;updateHUD();
  msg(wrongIdx!==null?'WRONG ORDER — GAME OVER!':'⏱ TIME UP — GAME OVER!','rby-miss');

  timers.push(setTimeout(function(){
    sequence.forEach(function(si,n){cellSt(si,'rby-correct',n+1)});
    if(isFullGameActive()){
      // The tracked Full Game keeps its own, existing flow — a miss
      // still moves on to the next quarter, not back to the hub.
      timers.push(setTimeout(showFinalScore,900));
    }else{
      // Standalone practice — a miss genuinely ends the round right
      // here. Brief "missed" notice, then straight back to the hub,
      // no in-page "Play Again" screen to linger on.
      recordLevelToStandings(currentPlayerName,g.best,(performance.now()-runStartTime)/1000);
      sessionStorage.setItem('hoop-last-quarter-key',THIS_GAME_KEY);
      timers.push(setTimeout(function(){
        msg('MISSED — TRY AGAIN','rby-miss');
        timers.push(setTimeout(function(){
          window.location.href='dynamic-hub.html';
        },1400));
      },500));
    }
  },400));
}

function autoNextRound(){if(phase!=='idle')return;resetCells();$('replay_clockFill').style.width='0%';$('replay_hTr').textContent='--';$('replay_actBtn').disabled=true;$('replay_restartBtn').style.display='none';startRound()}

function showFinalScore(){
  phase='idle';clrT();resetCells();updateHUD();$('replay_clockFill').style.width='0%';$('replay_hTr').textContent='--';
  if(gameMode==='training'){
    msg(g.roundsDone+'/'+TRAINING_ROUNDS+' — LEVEL '+trainingLevel+' · SCORE '+g.sc,'rby-miss');
  }else{
    msg('GAME OVER — SCORE '+g.sc+' ('+bpm+' BPM · BEST '+g.best+' CELLS)','rby-miss');
    recordLevelToStandings(currentPlayerName,g.best,(performance.now()-runStartTime)/1000);
  }
  $('replay_actBtn').textContent="PLAY AGAIN";$('replay_actBtn').onclick=restartGame;$('replay_actBtn').disabled=false;
  $('replay_restartBtn').style.display='none';
  if(isFullGameActive())showQuarterStats(g.sc);
}

function showTrainingComplete(){
  phase='idle';clrT();resetCells();updateHUD();$('replay_clockFill').style.width='0%';$('replay_hTr').textContent='--';
  msg('🏆 '+TRAINING_ROUNDS+'/'+TRAINING_ROUNDS+' — LEVEL '+trainingLevel+' COMPLETE! · SCORE '+g.sc,'rby-perfect');
  $('replay_actBtn').textContent="PLAY AGAIN";$('replay_actBtn').onclick=restartGame;$('replay_actBtn').disabled=false;
  $('replay_restartBtn').style.display='none';
  if(isFullGameActive())showQuarterStats(g.sc);
}

function restartGame(){
  clrT();phase='idle';stopFullStrobe();stopRecallTimer();
  g={sc:0,cellCount:getInitialCellCount(),best:0,streak:0,roundsDone:0};
  sequence=[];
  attemptNum=0;repeatOfferNum=0;roundShotLog=[];
  resetCells();updateHUD();$('replay_clockFill').style.width='0%';$('replay_hTr').textContent='--';
  msg("TAP LET'S GO!",'rby-watch');
  $('replay_actBtn').textContent="LET'S GO";$('replay_actBtn').onclick=startRound;$('replay_actBtn').disabled=false;$('replay_restartBtn').style.display='none';
}
$('replay_actBtn').onclick=startRound;
$('replayExitBtn').onclick=function(){window.location.href='dynamic-hub.html';};

// The player now genuinely clicks to start, matching the same
// pattern Ritnome uses — this isn't just about restoring the
// name-entry step, it's what makes the fullscreen request actually
// work. A programmatic launchGame() call on page load isn't a real
// user gesture, so the browser silently, correctly rejects the
// fullscreen request every time. A genuine click is the only way
// requestFullscreen() ever succeeds.
//
// The one real exception: a tracked Full Game run. dynamic-hub.html
// already requests fullscreen once, at the genuine click that
// commits to the run, specifically so it persists automatically
// across all four quarters' own page navigations — this quarter's
// own launchGame() call below is a safe no-op on the fullscreen
// front (it checks !document.fullscreenElement first), so skipping
// the name screen here doesn't reintroduce the bug at all. The
// player's name is already known from the hub, so there's nothing
// this screen would add for this specific path anyway.
if(isFullGameActive()){
  var storedName=sessionStorage.getItem('hoop-player-name');
  launchGame(storedName||'Player');
}
})();
