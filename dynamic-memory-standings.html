<!DOCTYPE html>
<html lang="en">
<head>
<!-- Standings now genuinely requires its own, separate access code
     — distinct from gameplay, checked and issued independently. -->
<script>
if (sessionStorage.getItem('dynamic-memory-standings-gate-pass') !== '1') {
  window.location.replace('dynamic-memory-standings-gate.html');
}
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DYNAMIC MEMORY — STANDINGS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;color:#fff;background:#000;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

#screen-box{display:flex;position:fixed;inset:0;z-index:200;flex-direction:column;align-items:center;background:radial-gradient(ellipse at center,#140800 0%,#000 70%);padding:20px 16px 24px;overflow-y:auto}
.box-title{font-size:1.7rem;font-weight:900;font-style:italic;letter-spacing:.06em;text-transform:uppercase;color:#fff;text-shadow:0 0 40px rgba(124,58,237,.8);margin-bottom:2px}
.box-title span{color:#FF6B35}
.box-sub{font-size:.72rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:#a78bfa;margin-bottom:16px;text-align:center}
.box-back-btn{align-self:flex-start;padding:8px 16px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.5);color:#fff;font-size:.78rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;cursor:pointer;margin-bottom:20px}
.box-empty{color:#7fa8c0;font-size:.85rem;padding:24px 8px;font-style:italic;text-align:center}

.standings-tab-row{display:flex;gap:6px;width:100%;max-width:560px;margin-bottom:18px;flex-wrap:wrap;justify-content:center}
.standings-tab{padding:8px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:#9fb3c8;font-size:.68rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.standings-tab.active{border-color:#FF6B35;color:#FF6B35;background:rgba(255,107,53,.1)}

.standings-row-header,.standings-row-main{display:grid;grid-template-columns:28px 1fr 76px 22px;gap:8px;align-items:center;padding:12px 10px;border-radius:10px;width:100%;max-width:520px}
.standings-row-header{font-size:.58rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#8892a0;padding:0 10px 8px}
.standings-row-header.flat{grid-template-columns:28px 1fr 60px}
.standings-row{width:100%;max-width:520px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;margin-bottom:6px;overflow:hidden;cursor:pointer}
.standings-row.standings-row-flat{cursor:default}
.standings-row.standings-row-flat .standings-row-main{grid-template-columns:28px 1fr 60px}
.standings-row.rank-1{border-color:rgba(255,211,90,.5);background:rgba(255,211,90,.08)}
.standings-row.rank-2{border-color:rgba(200,200,220,.4);background:rgba(200,200,220,.06)}
.standings-row.rank-3{border-color:rgba(255,140,66,.4);background:rgba(255,140,66,.06)}
.sr-rank{font-weight:900;color:#7c3aed}
.standings-row.rank-1 .sr-rank{color:#ffd35a}
.sr-name{text-align:left;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-total{font-weight:900;color:#fff;font-size:1rem;text-align:right}
.sr-total-sub{display:block;color:#7d8ba3;font-weight:700;font-size:.6rem;letter-spacing:.03em;text-align:right;margin-top:1px}
.sr-chevron{color:#7c8699;font-size:.7rem;transition:transform .18s;text-align:center}
.standings-row.open .sr-chevron{transform:rotate(180deg)}
.standings-detail{max-height:0;overflow:hidden;transition:max-height .2s ease}
.standings-row.open .standings-detail{max-height:170px}
.standings-detail-inner{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 12px 10px}
.standings-detail-inner.single{grid-template-columns:1fr;max-width:160px;margin:0 auto}
.sd-cell{text-align:center;padding:8px 4px;border-radius:8px;background:rgba(255,255,255,.04)}
.sd-label{font-size:.56rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:#8892a0;margin-bottom:3px}
.sd-val{font-size:.95rem;font-weight:900;color:#fff}
.standings-wrap{width:100%;display:flex;flex-direction:column;align-items:center}

#exitBtn{
  position:fixed;top:16px;right:16px;z-index:20;
  padding:8px 16px;border-radius:999px;border:2px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.5);color:#fff;font-size:.78rem;font-weight:900;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
}
</style>
</head>
<body>

<div id="screen-box">
  <button class="box-back-btn" id="refreshBtn" type="button">🔄 Refresh</button>
  <button id="exitBtn" type="button">Exit →</button>
  <div class="box-title">THE <span>STANDINGS</span></div>
  <div class="box-sub" id="boxSub">The Fortress · Best Total Score Per Player</div>

  <div class="standings-tab-row" id="standingsTabRow"></div>

  <div class="standings-wrap">
    <div class="standings-row-header" id="standingsHeader">
      <span></span><span style="text-align:left">Player</span><span style="text-align:right">Total</span><span></span>
    </div>
    <div id="standingsList" style="width:100%;display:flex;flex-direction:column;align-items:center"></div>
  </div>
</div>

<script>
function $(id){return document.getElementById(id)}

var SB_URL='https://sdaphocueugzfvjovuxd.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYXBob2N1ZXVnemZ2am92dXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQyMDgsImV4cCI6MjA5OTIwMDIwOH0.pDAzf4P6dD9eNEBlnP95SdF5BI-R84-Rdc0vKzYcn7M';

// All four games share one table and score by level_achieved,
// since each escalates by exactly one flash per successful round.
// The database keeps the real, raw level — the ×10-per-level points
// conversion happens only here, at display time, so the underlying
// data stays honest and the "10 points per level" framing stays a
// presentation choice, not a stored fact.
var QUARTER_TABLE='dynamic_memory_quarter_standings';
var POINTS_PER_LEVEL=10;

var STANDINGS_TABS=[
  {key:'fortress',label:'The Fortress'},
  {key:'recall',label:'Play Call'},
  {key:'replay',label:'Pass Path'},
  {key:'recognition',label:'Read the Defense'}
];
var currentTab='fortress';

// The Fortress keeps its own, separate table — a genuinely different
// score shape (a real 4-quarter breakdown plus a combined total) from
// the other three games, which all share one table and score by a
// single level_achieved instead.
var FORTRESS_TABLE='dynamic_memory_fortress_standings';
function fetchFortressStandings(){
  var school=sessionStorage.getItem('hoop-school')||'';
  var url=SB_URL+'/rest/v1/'+FORTRESS_TABLE+'?select=player_name,q1_score,q2_score,q3_score,q4_score,total_score,time_seconds&school_name=eq.'+encodeURIComponent(school);
  return fetch(url,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}})
    .then(function(r){if(!r.ok)throw new Error('bad response');return r.json()})
    .then(function(rows){
      var best={};
      (rows||[]).forEach(function(r){
        var existing=best[r.player_name];
        if(!existing||r.total_score>existing.total){
          best[r.player_name]={name:r.player_name,q1:r.q1_score,q2:r.q2_score,q3:r.q3_score,q4:r.q4_score,total:r.total_score,time:r.time_seconds};
        }
      });
      return Object.keys(best).map(function(n){return best[n]}).sort(function(a,b){return b.total-a.total});
    });
}

function fetchQuarterStandings(gameKey){
  var school=sessionStorage.getItem('hoop-school')||'';
  var url=SB_URL+'/rest/v1/'+QUARTER_TABLE+'?select=player_name,level_achieved,time_seconds&game_key=eq.'+encodeURIComponent(gameKey)+'&school_name=eq.'+encodeURIComponent(school);
  return fetch(url,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}})
    .then(function(r){if(!r.ok)throw new Error('bad response');return r.json()})
    .then(function(rows){
      var best={};
      (rows||[]).forEach(function(r){
        var existing=best[r.player_name];
        // Speed is the real tiebreaker between two players at the
        // same level — a higher level always wins outright, but
        // among rows tied at a player's own best level, the faster
        // time is what actually gets kept. A row with no recorded
        // time (saved before this was tracked) never beats a real,
        // timed one at the same level, since "unknown" isn't a
        // genuine claim to being faster.
        var isBetter=false;
        if(!existing){
          isBetter=true;
        }else if(r.level_achieved>existing.level){
          isBetter=true;
        }else if(r.level_achieved===existing.level){
          if(r.time_seconds!=null&&(existing.time==null||r.time_seconds<existing.time)){
            isBetter=true;
          }
        }
        if(isBetter){
          best[r.player_name]={name:r.player_name,level:r.level_achieved,time:r.time_seconds};
        }
      });
      return Object.keys(best).map(function(n){return best[n]}).sort(function(a,b){
        if(b.level!==a.level)return b.level-a.level;
        var at=a.time==null?Infinity:a.time, bt=b.time==null?Infinity:b.time;
        return at-bt;
      });
    });
}

function renderTabs(){
  var row=$('standingsTabRow');
  row.innerHTML=STANDINGS_TABS.map(function(t){
    return '<button class="standings-tab'+(t.key===currentTab?' active':'')+'" data-key="'+t.key+'">'+t.label+'</button>';
  }).join('');
  row.querySelectorAll('.standings-tab').forEach(function(btn){
    btn.addEventListener('click',function(){renderForTab(btn.dataset.key)});
  });
}

function renderForTab(tabKey){
  currentTab=tabKey;
  var tabConfig=STANDINGS_TABS.filter(function(t){return t.key===tabKey})[0];
  renderTabs();
  var listEl=$('standingsList');
  listEl.innerHTML='<div class="box-empty">Loading standings…</div>';

  if(tabKey==='fortress'){
    $('boxSub').textContent='The Fortress · Best Total Score Per Player';
    $('standingsHeader').className='standings-row-header';
    $('standingsHeader').innerHTML='<span></span><span style="text-align:left">Player</span><span style="text-align:right">Total</span><span></span>';
    fetchFortressStandings().then(function(ranked){
      if(!ranked.length){
        listEl.innerHTML='<div class="box-empty">No players yet — be the first name on the board.</div>';
        return;
      }
      listEl.innerHTML=ranked.map(function(p,i){
        var rankClass=i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'';
        var safeName=p.name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        var timeDisplay=p.time==null?'--':p.time.toFixed(2)+'s';
        return '<div class="standings-row '+rankClass+'">'
          +'<div class="standings-row-main">'
            +'<span class="sr-rank">'+(i+1)+'</span>'
            +'<span class="sr-name">'+safeName+'</span>'
            +'<span class="sr-total">'+p.total+'</span>'
            +'<span class="sr-chevron">▼</span>'
          +'</div>'
          +'<div class="standings-detail"><div class="standings-detail-inner" style="grid-template-columns:repeat(5,1fr)">'
            +'<div class="sd-cell"><div class="sd-label">1st</div><div class="sd-val">'+p.q1+'</div></div>'
            +'<div class="sd-cell"><div class="sd-label">2nd</div><div class="sd-val">'+p.q2+'</div></div>'
            +'<div class="sd-cell"><div class="sd-label">3rd</div><div class="sd-val">'+p.q3+'</div></div>'
            +'<div class="sd-cell"><div class="sd-label">4th</div><div class="sd-val">'+p.q4+'</div></div>'
            +'<div class="sd-cell"><div class="sd-label">Speed</div><div class="sd-val">'+timeDisplay+'</div></div>'
          +'</div></div>'
          +'</div>';
      }).join('');
      listEl.querySelectorAll('.standings-row').forEach(function(row){
        row.addEventListener('click',function(){row.classList.toggle('open')});
      });
    }).catch(function(){
      listEl.innerHTML='<div class="box-empty">Could not load standings right now — try again in a moment.</div>';
    });
    return;
  }

  $('boxSub').textContent=tabConfig.label+' · Best Level Achieved Per Player';
  $('standingsHeader').className='standings-row-header';
  $('standingsHeader').innerHTML='<span></span><span style="text-align:left">Player</span><span style="text-align:right">Score</span><span></span>';
  fetchQuarterStandings(tabKey).then(function(ranked){
    if(!ranked.length){
      listEl.innerHTML='<div class="box-empty">No players yet — be the first name on the board.</div>';
      return;
    }
    listEl.innerHTML=ranked.map(function(p,i){
      var rankClass=i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'';
      var safeName=p.name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      var levelDisplay='Level '+p.level;
      var timeDisplay=p.time==null?'--':p.time.toFixed(2)+' seconds';
      return '<div class="standings-row '+rankClass+'">'
        +'<div class="standings-row-main">'
          +'<span class="sr-rank">'+(i+1)+'</span>'
          +'<span class="sr-name">'+safeName+'</span>'
          +'<span class="sr-total">'+levelDisplay+'</span>'
          +'<span class="sr-chevron">▼</span>'
        +'</div>'
        +'<div class="standings-detail"><div class="standings-detail-inner single">'
          +'<div class="sd-cell"><div class="sd-label">Speed</div><div class="sd-val">'+timeDisplay+'</div></div>'
        +'</div></div>'
        +'</div>';
    }).join('');
    // Each row toggles its own detail open/closed — one player's
    // speed expanding shouldn't affect any other row on the board.
    listEl.querySelectorAll('.standings-row').forEach(function(row){
      row.addEventListener('click',function(){row.classList.toggle('open')});
    });
  }).catch(function(){
    listEl.innerHTML='<div class="box-empty">Could not load standings right now — try again in a moment.</div>';
  });
}

var validKeys=STANDINGS_TABS.map(function(t){return t.key});
// An explicit ?tab= param — set by a specific game's own Standings
// button on its intro screen — always wins over the session-based
// "last played" memory, since it's a direct, unambiguous signal
// about which board the player actually meant to open.
var urlTab=new URLSearchParams(window.location.search).get('tab');
var lastQuarter=sessionStorage.getItem('hoop-last-quarter-key');
var defaultTab='fortress';
if(urlTab&&validKeys.indexOf(urlTab)!==-1){
  defaultTab=urlTab;
}else if(lastQuarter&&validKeys.indexOf(lastQuarter)!==-1){
  defaultTab=lastQuarter;
}
renderForTab(defaultTab);
$('refreshBtn').addEventListener('click', function(){renderForTab(currentTab)});
$('exitBtn').addEventListener('click', function(){
  window.location.href = 'dynamic-hub.html';
});
setInterval(function(){renderForTab(currentTab)}, 30000);
</script>

</body>
</html>
